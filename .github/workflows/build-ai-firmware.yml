name: Build custom AI firmware

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-picco-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware:
    name: Build Picco
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PIO_ENV: picco
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest
          enable-cache: false

      - name: Install pinned pioarduino and ESP-IDF Python dependencies
        run: |
          set -euo pipefail
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Pin pioarduino core inside nested platform environment
        run: |
          set -euo pipefail
          pio pkg install -e "$PIO_ENV"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"

      - name: Compile firmware
        run: |
          set -euo pipefail
          pio run -e "$PIO_ENV" 2>&1 | tee build.log

      - name: Name binary and record checksum
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          name="crosspoint-ai-${PIO_ENV}-${short_sha}.bin"
          cp ".pio/build/${PIO_ENV}/firmware.bin" "$name"
          sha256sum "$name" > SHA256SUMS.txt
          printf 'Git revision: %s\nBoard: %s\n' "$GITHUB_SHA" "$PIO_ENV" > BUILD-INFO.txt
          cat BUILD-INFO.txt SHA256SUMS.txt

      - name: Upload firmware and build diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: crosspoint-ai-picco-${{ github.sha }}
          path: |
            crosspoint-ai-*.bin
            BUILD-INFO.txt
            SHA256SUMS.txt
            build.log
          if-no-files-found: error
