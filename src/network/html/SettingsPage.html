<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings - CrossPoint Reader</title>
  <style>
    .save-container {
      margin: 20px 0;
    }
    .item-box {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      margin: 10px 0;
    }
    .controls-group {
      margin-top: 24px;
    }
    .controls-group h3 {
      margin: 0 0 8px;
    }
    .controls-group .setting-control {
      max-width: 100%;
    }
    .controls-group select {
      max-width: 100%;
    }
    .item-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
  </style>
  <link rel="stylesheet" href="/assets/web.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/crosspoint-icon.svg" />
</head>
<body class="web-ui">
  <!--#include file="shared/Header.html.inc" -->
<main class="page-content">


  <div id="settings-container">
    <div class="loader-container">
      <span class="loader"></span>
    </div>
  </div>

  <div class="save-container" id="save-container" style="display:none;">
    <button class="save-btn" id="saveBtn" onclick="saveSettings()">Save Settings</button>
  </div>

  <div id="wifi-container"></div>
  <div id="opds-container"></div>
  <div id="ai-translation-container"></div>

  </main>
<!--#include file="shared/Footer.html.inc" -->

<script>
  let allSettings = [];
  let originalValues = {};
  let preserveQuickResumeTimeoutOn = false;
  let quickResumeTimeoutAutoEnabled = false;
  const SLEEP_SCREEN_MODE = {
    QUICK_RESUME: 6
  };

  function escapeHtml(unsafe) {
    return unsafe
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function renderControl(setting, suffix = '') {
    const id = 'setting-' + setting.key + suffix;

    if (setting.type === 'toggle') {
      const checked = setting.value ? 'checked' : '';
      return '<label class="toggle-switch">' +
        '<input type="checkbox" id="' + id + '" ' + checked + ' onchange="handleSettingChanged(\'' + setting.key + '\')">' +
        '<span class="toggle-slider"></span></label>';
    }

    if (setting.type === 'enum') {
      let html = '<select id="' + id + '" onchange="handleSettingChanged(\'' + setting.key + '\', this)">';
      setting.options.forEach(function(opt, idx) {
        const selected = idx === setting.value ? ' selected' : '';
        html += '<option value="' + idx + '"' + selected + '>' + escapeHtml(opt) + '</option>';
      });
      html += '</select>';
      return html;
    }

    if (setting.type === 'value') {
      return '<input type="number" id="' + id + '" value="' + setting.value + '"' +
        ' min="' + setting.min + '" max="' + setting.max + '" step="' + setting.step + '"' +
        ' onchange="handleSettingChanged(\'' + setting.key + '\')">';
    }

    if (setting.type === 'string') {
      const isPassword = 'hasPassword' in setting;
      const inputType = isPassword ? 'password' : 'text';
      const val = setting.value || '';
      return '<input type="' + inputType + '" id="' + id + '" value="' + escapeHtml(val) + '"' +
        ' placeholder="' + (setting.hasPassword ? '(unchanged)' : '') + '"' +
        ' oninput="this.dataset.changed=\'true\';handleSettingChanged(\'' + setting.key + '\')">' +
        (setting.hasPassword ? ' <button class="btn-small btn-delete" type="button" onclick="clearPassword(\'' + setting.key + '\')">Clear</button>' : '');
    }

    return '';
  }

  function getValue(setting) {
    const el = document.getElementById('setting-' + setting.key);
    if (!el) return undefined;

    if (setting.type === 'toggle') {
      return el.checked ? 1 : 0;
    }
    if (setting.type === 'enum') {
      return parseInt(el.value, 10);
    }
    if (setting.type === 'value') {
      return parseInt(el.value, 10);
    }
    if (setting.type === 'string') {
      if ('hasPassword' in setting && !el.dataset.changed) return undefined;
      return el.value;
    }
    return undefined;
  }

  function markChanged() {
    document.getElementById('saveBtn').disabled = false;
  }

  function clearPassword(key) {
    const el = getControl(key);
    el.value = '';
    el.dataset.changed = 'true';
    handleSettingChanged(key);
  }

  function findSetting(key) {
    return allSettings.find(function(s) { return s.key === key; });
  }

  function getControl(key) {
    return document.getElementById('setting-' + key);
  }

  function getControlValue(key) {
    const setting = findSetting(key);
    const el = getControl(key);
    if (!setting || !el) return undefined;

    if (setting.type === 'toggle') {
      return el.checked ? 1 : 0;
    }
    if (setting.type === 'enum' || setting.type === 'value') {
      return parseInt(el.value, 10);
    }
    return el.value;
  }

  function setControlValue(key, value) {
    const setting = findSetting(key);
    const el = getControl(key);
    if (!setting || !el) return false;

    if (setting.type === 'toggle') {
      const checked = !!value;
      if (el.checked === checked) return false;
      el.checked = checked;
      return true;
    }

    const nextValue = String(value);
    if (el.value === nextValue) return false;
    el.value = nextValue;
    return true;
  }

  function isQuickResumeSleepScreenSelected() {
    const sleepScreen = findSetting('sleepScreen');
    const sleepScreenValue = getControlValue('sleepScreen');
    if (!sleepScreen || sleepScreenValue === undefined || !Number.isFinite(sleepScreenValue)) return false;

    let selectedValue = sleepScreenValue;
    if (Array.isArray(sleepScreen.values)) {
      selectedValue = Number(sleepScreen.values[sleepScreenValue]);
    } else if (Array.isArray(sleepScreen.options)) {
      const selectedOption = sleepScreen.options[sleepScreenValue];
      if (selectedOption && typeof selectedOption === 'object' && 'value' in selectedOption) {
        selectedValue = Number(selectedOption.value);
      }
    }

    return selectedValue === SLEEP_SCREEN_MODE.QUICK_RESUME;
  }

  function syncQuickResumeTimeoutForSleepScreen(sleepScreenChanged, quickResumeTimeoutChanged) {
    const timeoutValue = getControlValue('quickResumeSleepScreen');
    if (timeoutValue === undefined) return false;

    let changed = false;
    if (quickResumeTimeoutChanged) {
      preserveQuickResumeTimeoutOn = timeoutValue === 1;
      quickResumeTimeoutAutoEnabled = false;
    }

    if (isQuickResumeSleepScreenSelected()) {
      if (timeoutValue !== 1) {
        changed = setControlValue('quickResumeSleepScreen', 1);
        quickResumeTimeoutAutoEnabled = !preserveQuickResumeTimeoutOn;
      } else if (sleepScreenChanged && !preserveQuickResumeTimeoutOn) {
        quickResumeTimeoutAutoEnabled = true;
      }
      return changed;
    }

    if (sleepScreenChanged && quickResumeTimeoutAutoEnabled && !preserveQuickResumeTimeoutOn) {
      changed = setControlValue('quickResumeSleepScreen', 0);
      quickResumeTimeoutAutoEnabled = false;
    }
    return changed;
  }

  function updateSettingsVisibility() {
    // Footnotes is display index 4 in both SettingsList.h Power option lists.
    const footnotesSelected = getControlValue('shortPwrBtn') === 4 || getControlValue('doublePwrBtn') === 4;
    const row = document.getElementById('row-setting-pwrBtnFootnoteBack');
    if (row) row.style.display = footnotesSelected ? '' : 'none';
  }

  function handleSettingChanged(key, source) {
    if (key === 'longPressButtonBehavior' && source) {
      getControl(key).value = source.value;
      const duplicate = document.getElementById('setting-' + key + '-side');
      if (duplicate) duplicate.value = source.value;
    }
    syncQuickResumeTimeoutForSleepScreen(key === 'sleepScreen', key === 'quickResumeSleepScreen');
    if (key === 'shortPwrBtn' || key === 'doublePwrBtn') {
      updateSettingsVisibility();
    }
    markChanged();
  }

  function renderSettingRow(setting, suffix = '') {
    const name = setting.key === 'longPressButtonBehavior' ? 'Page turn long press' : setting.name;
    return '<div class="setting-row" id="row-setting-' + setting.key + suffix + '">' +
      '<label class="setting-name" for="setting-' + setting.key + suffix + '">' + escapeHtml(name) + '</label>' +
      '<span class="setting-control">' + renderControl(setting, suffix) + '</span></div>';
  }

  function renderCategory(settings) {
    const definitions = [
      ['Home button gestures', ['homeButtonTapAction', 'homeButtonDoubleTapAction', 'homeButtonLongPressAction']],
      ['Power button', ['shortPwrBtn', 'doublePwrBtn', 'pwrBtnFootnoteBack']],
      ['Front buttons', ['frontButtonFollowOrientation', 'backShortToFileBrowser']],
      ['Side buttons', ['sideButtonLayout', 'sideButtonFollowOrientation']],
      ['Taps and gestures', ['touchReaderControls', 'pageTurnGesture', 'previousPageGesture', 'tapForReaderMenu']]
    ];
    const assigned = new Set();
    let grouped = '';
    definitions.forEach(function(definition) {
      const title = definition[0];
      const keys = definition[1];
      if (!settings.some(function(s) { return keys.includes(s.key); })) return;
      if (title === 'Front buttons') keys.push('longPressButtonBehavior', 'longPressMenuFunction');
      if (title === 'Side buttons') keys.push('longPressButtonBehavior');
      grouped += '<section class="controls-group"><h3>' + title + '</h3>';
      keys.forEach(function(key) {
        const setting = settings.find(function(s) { return s.key === key; });
        if (!setting) return;
        const suffix = assigned.has(key) ? '-side' : '';
        grouped += renderSettingRow(setting, suffix);
        assigned.add(key);
      });
      grouped += '</section>';
    });
    // Unmapped settings stay visible, including board-specific controls.
    return settings.filter(function(s) { return !assigned.has(s.key); }).map(function(s) {
      return renderSettingRow(s);
    }).join('') + grouped;
  }

  async function loadSettings() {
    try {
      const response = await fetch('/api/settings');
      if (!response.ok) {
        throw new Error('Failed to load settings: ' + response.status);
      }
      allSettings = await response.json();

      // Store original values
      originalValues = {};
      allSettings.forEach(function(s) {
        originalValues[s.key] = s.value;
      });

      // Group by category
      const groups = {};
      allSettings.forEach(function(s) {
        if (!groups[s.category]) groups[s.category] = [];
        groups[s.category].push(s);
      });

      const container = document.getElementById('settings-container');
      let html = '';

      for (const category in groups) {
        html += '<div class="card"><h2>' + escapeHtml(category) + '</h2>';
        html += renderCategory(groups[category]);
        html += '</div>';
      }

      container.innerHTML = html;
      updateSettingsVisibility();
      document.getElementById('save-container').style.display = '';
      document.getElementById('saveBtn').disabled = true;
      preserveQuickResumeTimeoutOn = getControlValue('quickResumeSleepScreen') === 1;
      quickResumeTimeoutAutoEnabled = false;
      if (syncQuickResumeTimeoutForSleepScreen(true, false)) {
        markChanged();
      }
    } catch (e) {
      console.error(e);
      document.getElementById('settings-container').innerHTML =
        '<div class="card"><p style="text-align:center;color:var(--danger-color);">Failed to load settings</p></div>';
    }
  }

  async function saveSettings() {
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    // Collect only changed values
    const changes = {};
    allSettings.forEach(function(s) {
      const current = getValue(s);
      if (current !== undefined && current !== originalValues[s.key]) {
        changes[s.key] = current;
      }
    });

    if (Object.keys(changes).length === 0) {
      showWebToast('No changes to save.', false);
      btn.textContent = 'Save Settings';
      return;
    }

    try {
      const response = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(changes)
      });

      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || 'Save failed');
      }

      // Update original values to new values
      for (const key in changes) {
        originalValues[key] = changes[key];
      }

      showWebToast('Settings saved successfully!', false);
    } catch (e) {
      console.error(e);
      showWebToast('Error: ' + e.message, true);
    }

    btn.textContent = 'Save Settings';
  }

  // --- Wi-Fi Network Management ---
  // A Wi-Fi or OPDS entry's Save stays disabled until one of its fields changes;
  // a successful save re-renders the list, which disables it again.
  function enableItemSave(box) {
    box.querySelector('.btn-save-server').disabled = false;
  }

  // Renders an editable list of saved Wi-Fi networks using /api/wifi endpoints.
  // Password fields are never pre-filled; when left blank during edit, existing
  // passwords remain unchanged server-side.
  let wifiNetworks = [];

  function renderWifiNetwork(net, idx) {
    const isNew = idx === -1;
    const id = isNew ? 'new' : idx;
    const lastConnected = net.isLastConnected
      ? '<div style="margin-top:8px;color:var(--label-color);font-size:0.9em;">Last connected network</div>'
      : '';

    return '<div class="item-box" id="wifi-' + id + '" oninput="enableItemSave(this)">' +
      '<div class="setting-row">' +
        '<span class="setting-name">SSID</span>' +
        '<span class="setting-control"><input type="text" id="wifi-ssid-' + id + '" value="' + escapeHtml(net.ssid || '') + '"></span>' +
      '</div>' +
      '<div class="setting-row">' +
        '<span class="setting-name">Password</span>' +
        '<span class="setting-control"><input type="password" id="wifi-pass-' + id + '" placeholder="' + (net.hasPassword ? '(unchanged)' : '') + '"></span>' +
      '</div>' +
      lastConnected +
      '<div class="item-actions">' +
        '<button class="btn-small btn-save-server" onclick="saveWifiNetwork(' + idx + ')" disabled>Save</button>' +
        (isNew ? '' : '<button class="btn-small btn-delete" onclick="deleteWifiNetwork(' + idx + ')">Delete</button>') +
      '</div>' +
    '</div>';
  }

  function renderWifiSection() {
    const container = document.getElementById('wifi-container');
    let html = '<div class="card"><h2>Wi-Fi Networks</h2>';

    if (wifiNetworks.length === 0) {
      html += '<p style="color:var(--label-color);text-align:center;">No Wi-Fi networks saved</p>';
    } else {
      wifiNetworks.forEach(function(net, idx) {
        html += renderWifiNetwork(net, idx);
      });
    }

    html += '<div style="margin-top:12px;text-align:center;">' +
      '<button class="btn-small btn-add" onclick="addWifiNetwork()">+ Add Network</button>' +
    '</div></div>';
    container.innerHTML = html;
  }

  async function loadWifiNetworks() {
    try {
      const resp = await fetch('/api/wifi');
      if (!resp.ok) throw new Error('Failed to load');
      wifiNetworks = await resp.json();
      renderWifiSection();
    } catch (e) {
      console.error('Wi-Fi load error:', e);
    }
  }

  function addWifiNetwork() {
    const container = document.getElementById('wifi-container');
    const card = container.querySelector('.card');
    const addBtn = card.querySelector('.btn-add').parentElement;
    // Prevent multiple unsaved new-network forms at once (idx -1 -> id "new")
    if (document.getElementById('wifi-new')) return;
    addBtn.insertAdjacentHTML('beforebegin', renderWifiNetwork({ssid:'',hasPassword:false,isLastConnected:false}, -1));
  }

  async function saveWifiNetwork(idx) {
    const id = idx === -1 ? 'new' : idx;
    const ssid = document.getElementById('wifi-ssid-' + id).value.trim();
    if (!ssid) {
      showWebToast('SSID is required.', true);
      return;
    }

    const data = { ssid: ssid };
    // Only include password when the user actually typed something; omitting it
    // tells the server to preserve an existing password.
    const pass = document.getElementById('wifi-pass-' + id).value;
    if (pass) data.password = pass;
    if (idx >= 0) data.index = idx;

    try {
      const resp = await fetch('/api/wifi', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      if (!resp.ok) throw new Error(await resp.text());
      showWebToast('Wi-Fi network saved!', false);
      await loadWifiNetworks();
    } catch (e) {
      showWebToast('Error: ' + e.message, true);
    }
  }

  async function deleteWifiNetwork(idx) {
    if (!await showWebConfirm('Delete this Wi-Fi network?')) return;
    try {
      const resp = await fetch('/api/wifi/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({index: idx})
      });
      if (!resp.ok) throw new Error(await resp.text());
      showWebToast('Wi-Fi network deleted', false);
      await loadWifiNetworks();
    } catch (e) {
      showWebToast('Error: ' + e.message, true);
    }
  }

  // --- OPDS Server Management ---
  // Dynamically renders an editable list of OPDS servers, communicating with the
  // /api/opds REST endpoints. Password fields are never pre-filled for security;
  // the "(unchanged)" placeholder indicates an existing password is preserved on save.
  let opdsServers = [];

  const OPDS_MAX_CUSTOM_HEADERS = 2;

  function renderOpdsHeaderRows(srv, id) {
    const headers = srv.headers || [];
    let html = '';
    for (let i = 0; i < OPDS_MAX_CUSTOM_HEADERS; i++) {
      const header = headers[i] || {name: '', hasValue: false};
      html +=
        '<div class="setting-row">' +
          '<span class="setting-name">Header ' + (i + 1) + ' Name</span>' +
          '<span class="setting-control"><input type="text" id="opds-header' + i + '-name-' + id + '" value="' + escapeHtml(header.name || '') + '"></span>' +
        '</div>' +
        '<div class="setting-row">' +
          '<span class="setting-name">Header ' + (i + 1) + ' Value</span>' +
          '<span class="setting-control"><input type="password" id="opds-header' + i + '-value-' + id + '" placeholder="' + (header.hasValue ? '(unchanged)' : '') + '"></span>' +
        '</div>';
    }
    return html;
  }

  function renderOpdsServer(srv, idx) {
    const isNew = idx === -1;
    const id = isNew ? 'new' : idx;
    return '<div class="item-box" id="opds-' + id + '" oninput="enableItemSave(this)">' +
      '<div class="setting-row">' +
        '<span class="setting-name">Server Name</span>' +
        '<span class="setting-control"><input type="text" id="opds-name-' + id + '" value="' + escapeHtml(srv.name || '') + '"></span>' +
      '</div>' +
      '<div class="setting-row">' +
        '<span class="setting-name">URL</span>' +
        '<span class="setting-control"><input type="text" id="opds-url-' + id + '" value="' + escapeHtml(srv.url || '') + '"></span>' +
      '</div>' +
      '<div class="setting-row">' +
        '<span class="setting-name">Username</span>' +
        '<span class="setting-control"><input type="text" id="opds-user-' + id + '" value="' + escapeHtml(srv.username || '') + '"></span>' +
      '</div>' +
      '<div class="setting-row">' +
        '<span class="setting-name">Password</span>' +
        '<span class="setting-control"><input type="password" id="opds-pass-' + id + '" placeholder="' + (srv.hasPassword ? '(unchanged)' : '') + '"></span>' +
      '</div>' +
      renderOpdsHeaderRows(srv, id) +
      '<div class="item-actions">' +
        '<button class="btn-small btn-save-server" onclick="saveOpdsServer(' + idx + ')" disabled>Save</button>' +
        (isNew ? '' : '<button class="btn-small btn-delete" onclick="deleteOpdsServer(' + idx + ')">Delete</button>') +
      '</div>' +
    '</div>';
  }

  function renderOpdsSection() {
    const container = document.getElementById('opds-container');
    let html = '<div class="card"><h2>OPDS Servers</h2>';

    if (opdsServers.length === 0) {
      html += '<p style="color:var(--label-color);text-align:center;">No OPDS servers configured</p>';
    } else {
      opdsServers.forEach(function(srv, idx) {
        html += renderOpdsServer(srv, idx);
      });
    }

    html += '<div style="margin-top:12px;text-align:center;">' +
      '<button class="btn-small btn-add" onclick="addOpdsServer()">+ Add Server</button>' +
    '</div></div>';
    container.innerHTML = html;
  }

  async function loadOpdsServers() {
    try {
      const resp = await fetch('/api/opds');
      if (!resp.ok) throw new Error('Failed to load');
      opdsServers = await resp.json();
      renderOpdsSection();
    } catch (e) {
      console.error('OPDS load error:', e);
    }
  }

  function addOpdsServer() {
    const container = document.getElementById('opds-container');
    const card = container.querySelector('.card');
    const addBtn = card.querySelector('.btn-add').parentElement;
    // Prevent multiple unsaved new-server forms at once (idx -1 → id "new")
    if (document.getElementById('opds-new')) return;
    addBtn.insertAdjacentHTML('beforebegin', renderOpdsServer({name:'',url:'',username:'',hasPassword:false,headers:[]}, -1));
  }

  async function saveOpdsServer(idx) {
    const id = idx === -1 ? 'new' : idx;
    const data = {
      name: document.getElementById('opds-name-' + id).value,
      url: document.getElementById('opds-url-' + id).value,
      username: document.getElementById('opds-user-' + id).value,
    };
    // Only include password in payload when the user actually typed something;
    // omitting it tells the server to keep the existing password.
    const pass = document.getElementById('opds-pass-' + id).value;
    if (pass) data.password = pass;

    // Same rule per header: omit "value" to keep that slot's existing value unchanged.
    const headers = [];
    for (let i = 0; i < OPDS_MAX_CUSTOM_HEADERS; i++) {
      const name = document.getElementById('opds-header' + i + '-name-' + id).value.trim();
      const value = document.getElementById('opds-header' + i + '-value-' + id).value;
      const header = {name: name};
      // Also send an explicit (empty) value when the name was cleared, so the
      // server can tell "delete this header" apart from "leave value unchanged".
      if (value || !name) header.value = value;
      headers.push(header);
    }
    data.headers = headers;

    if (idx >= 0) data.index = idx;

    try {
      const resp = await fetch('/api/opds', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });
      if (!resp.ok) throw new Error(await resp.text());
      showWebToast('OPDS server saved!', false);
      await loadOpdsServers();
    } catch (e) {
      showWebToast('Error: ' + e.message, true);
    }
  }

  async function deleteOpdsServer(idx) {
    if (!await showWebConfirm('Delete this OPDS server?')) return;
    try {
      const resp = await fetch('/api/opds/delete', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({index: idx})
      });
      if (!resp.ok) throw new Error(await resp.text());
      showWebToast('OPDS server deleted', false);
      await loadOpdsServers();
    } catch (e) {
      showWebToast('Error: ' + e.message, true);
    }
  }

  // --- Personal AI translation (no Linga account or service required) ---
  let aiTranslation = {url: '', model: '', reasoningEffort: 'default', ai_cache_server_url: '', hasKey: false, hasCacheServerToken: false};
  const aiEffortOptions = [
    ['default', 'Default (provider)'],
    ['low', 'Low'],
    ['medium', 'Medium'],
    ['high', 'High']
  ];

  function renderAiTranslation() {
    const config = aiTranslation;
    const selectedEffort = aiEffortOptions.some(opt => opt[0] === config.reasoningEffort)
      ? config.reasoningEffort : 'default';
    const effortOptions = aiEffortOptions.map(opt =>
      '<option value="' + opt[0] + '"' + (opt[0] === selectedEffort ? ' selected' : '') +
      '>' + escapeHtml(opt[1]) + '</option>').join('');
    document.getElementById('ai-translation-container').innerHTML =
      '<div class="card"><h2>AI Translation</h2>' +
      '<p style="color:var(--label-color);">Translate the selected word and its full EPUB sentence to Russian through the AI Cache Server. No online provider credentials are needed on the device.</p>' +
      '<div class="item-box" oninput="enableItemSave(this)">' +
        '<div class="setting-row"><label class="setting-name" for="ai-cache-server-url">AI Cache Server URL</label>' +
          '<span class="setting-control"><input type="url" id="ai-cache-server-url" spellcheck="false" value="' + escapeHtml(config.ai_cache_server_url || '') + '" placeholder="http://192.168.50.37:8791"></span></div>' +
        '<div class="setting-row"><label class="setting-name" for="ai-cache-server-token">AI Cache Server Token</label>' +
          '<span class="setting-control"><input type="password" id="ai-cache-server-token" autocomplete="new-password" spellcheck="false" placeholder="' + (config.hasCacheServerToken ? '(unchanged)' : '(optional)') + '"></span></div>' +
        '<div class="setting-row"><label class="setting-name" for="ai-reasoning-effort">Reasoning effort</label>' +
          '<span class="setting-control"><select id="ai-reasoning-effort" onchange="enableItemSave(this.closest(\'.item-box\'))">' +
          effortOptions + '</select></span></div>' +
        '<label style="display:flex;align-items:center;gap:8px;margin-top:8px;"><input type="checkbox" id="ai-clear-cache-token"> Remove saved cache server token</label>' +
        '<div class="item-actions"><button class="btn-small btn-save-server" onclick="saveAiTranslation()" disabled>Save</button></div>' +
      '</div>' +
      '<p style="color:var(--label-color);font-size:0.9em;">AI Cache Server is optional (empty URL = disabled). The token is optional; leave its field blank to keep the saved token, or use the checkbox to remove it. The token is sent as a URL query parameter. Use HTTPS/Tailscale Funnel to protect it in transit; plain HTTP sends book contents and the token unencrypted.</p>' +
      '<p style="color:var(--label-color);font-size:0.9em;">Reasoning effort applies to OpenAI-compatible API calls (including foreground translation and prefetch). Default omits the field. Gemini uses a different API and ignores this setting; unsupported models/providers may reject non-default values.</p>' +
      '<p style="color:var(--label-color);font-size:0.9em;">Examples: Gemini URL https://generativelanguage.googleapis.com/v1beta and model gemini-2.5-flash; Groq URL https://api.groq.com/openai/v1 and model openai/gpt-oss-20b; OpenCode Go URL https://opencode.ai/inference/go/openai/v1 and model deepseek-v4.1-flash. Older OpenCode Go URLs are automatically migrated during translation. The model must be available under the Go subscription (for example, hy4-flash-free or deepseek-v4.1-flash). The API key is not returned by this page. The web UI uses local HTTP on your local network; use trusted Wi-Fi only.</p>' +
      '</div>';
  }

  async function loadAiTranslation() {
    try {
      const response = await fetch('/api/ai-translation', {cache: 'no-store'});
      if (!response.ok) throw new Error('HTTP ' + response.status);
      aiTranslation = await response.json();
      renderAiTranslation();
    } catch (e) {
      document.getElementById('ai-translation-container').innerHTML =
        '<div class="card"><h2>AI Translation</h2><p>Could not load AI settings.</p></div>';
    }
  }

  async function saveAiTranslation() {
    const box = document.getElementById('ai-translation-container');
    const btn = box.querySelector('.btn-save-server');
    btn.disabled = true;
    const data = {reasoningEffort: document.getElementById('ai-reasoning-effort').value,
                  ai_cache_server_url: document.getElementById('ai-cache-server-url').value.trim()};
    const cacheToken = document.getElementById('ai-cache-server-token').value.trim();
    if (document.getElementById('ai-clear-cache-token').checked) data.clearCacheServerToken = true;
    else if (cacheToken) data.ai_cache_server_token = cacheToken;
    try {
      const response = await fetch('/api/ai-translation', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data)
      });
      if (!response.ok) throw new Error(await response.text());
      showWebToast('AI translation settings saved', false);
      await loadAiTranslation();
    } catch (e) {
      showWebToast('Error: ' + e.message, true);
      btn.disabled = false;
    }
  }

  // Sequential, not concurrent: the device's web server handles one client
  // connection at a time, and simultaneous fetches on page load can
  // stall long enough inside a single response to trip the firmware watchdog.
  (async () => {
    await loadSettings();
    await loadWifiNetworks();
    await loadOpdsServers();
    await loadAiTranslation();
  })();
</script>
</body>
</html>
